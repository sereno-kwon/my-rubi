# My Rubi 재고 조회 서비스 (Synology Container Manager 프로젝트)
# 이 폴더(stock.py, stock.env 가 있는 곳)를 프로젝트 경로로 지정하면 됨. 설치 안내는 README.md
services:
  rubi-stock:
    image: python:3.12-slim
    container_name: rubi-stock
    restart: unless-stopped
    working_dir: /app
    command: python -u stock.py serve
    env_file: stock.env
    environment:
      - TZ=Asia/Seoul
      - DATA_DIR=/data
    volumes:
      - ./stock.py:/app/stock.py:ro
      # 세션·품목 목록 저장소. NAS 폴더가 아니라 Docker가 관리하는 볼륨이라 미리 만들 폴더가 없음
      - rubi-stock-data:/data
      # 이카운트 회사코드·사용자 ID·인증키는 ecount-sync 설정에서 그대로 읽음 (읽기 전용)
      # ecount-sync 폴더가 rubi-stock 옆이 아니면 이 줄의 왼쪽 경로를 고침
      - ../ecount-sync:/ecount-sync:ro
    # NAS 안(역방향 프록시)에서만 들어오게 127.0.0.1 에만 엶
    ports:
      - "127.0.0.1:8790:8790"

volumes:
  rubi-stock-data:
