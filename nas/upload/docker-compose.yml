# My Rubi 상품 업로드 서비스 (Synology Container Manager 프로젝트)
# 이 폴더(upload.py, upload.env, template.xlsx 가 있는 곳)를 프로젝트 경로로 지정. 설치 안내는 README.md
services:
  rubi-upload:
    image: python:3.12-slim
    container_name: rubi-upload
    restart: unless-stopped
    working_dir: /app
    # 엑셀(openpyxl)과 이미지(Pillow) 패키지를 받고 시작. 받은 패키지는 pip-cache 볼륨에 남아 다음 시작이 빠름
    command: sh -c "pip install -q --disable-pip-version-check --cache-dir /pip-cache openpyxl==3.1.5 pillow==11.0.0 && python -u upload.py serve"
    env_file: upload.env
    environment:
      - TZ=Asia/Seoul
      - DATA_DIR=/data
      - STOCK_DATA_DIR=/stock-data
      - ECOUNT_SYNC_DIR=/ecount-sync
    # NAS 안의 재고 조회 서비스(127.0.0.1:8790)를 부르고, Web Station 연결 파일이 127.0.0.1:8791 로 부르게 호스트 네트워크를 씀
    # 서비스는 127.0.0.1 에만 열려 밖에서는 들어올 수 없음
    network_mode: host
    volumes:
      - ./upload.py:/app/upload.py:ro
      - ./template.xlsx:/app/template.xlsx:ro
      # 검토 상태·초안·만든 파일 저장소 (Docker가 관리하는 볼륨)
      - rubi-upload-data:/data
      - rubi-upload-pip:/pip-cache
      # 이카운트 품목 목록: 재고 조회 서비스(rubi-stock)가 받아 둔 catalog.json 을 읽기 전용으로
      - rubi-stock-data:/stock-data:ro
      # 아임웹 액세스 토큰: ecount-sync 폴더에서 읽기만 함. ecount-sync 폴더가 rubi-upload 옆이 아니면 왼쪽 경로를 고침
      - ../ecount-sync:/ecount-sync:ro

volumes:
  rubi-upload-data:
  rubi-upload-pip:
  # rubi-stock 프로젝트가 만든 볼륨. Container Manager → 볼륨 에서 이름이 다르면 name 을 고침
  rubi-stock-data:
    external: true
    name: rubi-stock_rubi-stock-data
