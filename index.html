<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Rubi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101114">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 5h14l6 8-13 15L3 13z' fill='%239b2335'/%3E%3Cpath d='M3 13h26M9 5l7 23 7-23' fill='none' stroke='%23fff' stroke-opacity='.45' stroke-width='1.4'/%3E%3C/svg%3E">
<script>try{var t=JSON.parse(localStorage.getItem('myrubi.text.v1')||'{}').theme;if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="/assets/rubi-type.css">
<link rel="stylesheet" href="/assets/common.css?v=20261029c">
<link rel="stylesheet" href="/assets/text.css?v=20261029g">
</head>
<body>

<!-- 텍스트 화면: 목록이 곧 인터페이스. 입력하면 걸러지고, 방향키로 고르고, Enter로 연다 -->
<header class="top">
  <a class="brand" href="/" id="home" aria-label="My Rubi 처음으로"><span class="gem"></span><span class="wm">MY RUBI</span></a>
  <nav class="top-r">
    <span class="who" id="who"></span>
    <button class="top-btn" id="btnSettings">설정</button>
    <button class="top-btn hidden" id="btnLogout">로그아웃</button>
  </nav>
</header>

<main class="wrap">
  <section class="cmd">
    <div class="crumb" id="crumb"></div>
    <label class="prompt">
      <span class="slash" aria-hidden="true">/</span>
      <input id="q" type="text" placeholder="무엇을 열까요" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="앱 찾기" aria-controls="list">
    </label>
    <p class="keys"><span><kbd>↑</kbd><kbd>↓</kbd> 고르기</span><span><kbd>Enter</kbd> 열기</span><span><kbd>1</kbd>–<kbd id="kMax">9</kbd> 바로 열기</span><span><kbd>Esc</kbd> 뒤로</span></p>
    <p class="recent hidden" id="recent"></p>
    <div class="list" id="list" role="listbox" aria-label="앱 목록"></div>
  </section>

  <aside class="side" aria-label="오늘">
    <div class="today">
      <p class="kicker">TODAY</p>
      <p class="clock" id="clock"></p>
      <p class="date" id="date"></p>
      <p class="hours">쇼룸·고객센터 월~금 12:00~18:00</p>
    </div>
    <!-- 구글 캘린더 한 달 격자 (assets/calendar.js). 로그인 뒤 Apps Script가 CONFIG.CALENDARS 의 일정을 돌려줌 -->
    <div class="cal hidden" id="cal" aria-label="달력"></div>
    <!-- 공지·일정(assets/board.js)이 이 자리 바로 앞에 붙음 -->
    <div id="windows" hidden></div>
    <!-- 멤버별 체크리스트 요약 (assets/checklist.js). 공지·일정 아래. 이름을 누르면 체크리스트 패널이 열림 -->
    <div class="checks hidden" id="checks" aria-label="체크리스트"></div>
  </aside>
</main>

<!-- 포털 안에서 여는 앱 (상담 현황, 재고 확인, NAS, 체크리스트, 설정) -->
<section class="panel hidden" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <header class="p-bar">
    <button class="p-back" id="pBack" aria-label="목록으로"><svg class="i"><use href="#i-back"/></svg></button>
    <div class="p-ttl"><span class="p-crumb" id="pCrumb"></span><h1 id="pTitle"></h1></div>
    <a class="p-btn hidden" id="pOut" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
    <button class="p-btn" id="pClose">닫기 <kbd>Esc</kbd></button>
  </header>
  <div class="p-body" id="pBody"></div>
</section>

<div class="ctx hidden" id="ctx" role="menu"></div>

<!-- 잠금 화면 (config.js 에 GOOGLE_CLIENT_ID 가 있을 때만) -->
<div class="lock hidden" id="lock" role="dialog" aria-label="로그인">
  <div class="lock-in">
    <div class="lock-mark"><span class="gem"></span><span class="wm">MY RUBI</span></div>
    <p class="lock-t" id="lockT"></p>
    <p class="lock-d" id="lockD"></p>
    <p class="lock-sub">회사 구글 계정으로 로그인하세요</p>
    <div class="lock-btn" id="gBtn"></div>
    <p class="lock-msg" id="lockMsg" role="status"></p>
  </div>
</div>
