<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Rubi</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --desk-1:#2b2d31; --desk-2:#1b1c1f; --ink:#f2f2f0; --ink-2:rgba(255,255,255,.62); --ink-3:rgba(255,255,255,.38);
  --glass:rgba(255,255,255,.08); --glass-2:rgba(255,255,255,.14); --line:rgba(255,255,255,.12);
  --win-bg:#f4f4f2; --win-head:#2f3136; --accent:#b8402e;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;color:var(--ink);font-size:14px;
  background:
    radial-gradient(1200px 700px at 15% 0%, #3a3d44 0%, transparent 60%),
    radial-gradient(900px 600px at 95% 100%, #35302c 0%, transparent 55%),
    linear-gradient(160deg,var(--desk-1),var(--desk-2));
  -webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;cursor:pointer}

/* 상단 바 */
.topbar{position:fixed;top:0;left:0;right:0;height:30px;display:flex;align-items:center;padding:0 14px;gap:14px;
  background:rgba(0,0,0,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);font-size:12px;z-index:50}
.topbar .brand{font-weight:700;letter-spacing:.1em}
.topbar .brand small{font-weight:400;color:var(--ink-3);margin-left:8px;letter-spacing:.02em}
.topbar .sp{flex:1}
.topbar .clock{font-family:var(--mono);color:var(--ink-2);letter-spacing:.02em}

/* 바탕화면 아이콘 */
.desktop{position:fixed;inset:30px 0 64px 0;padding:28px 24px;display:grid;grid-template-columns:repeat(auto-fill,96px);grid-auto-rows:104px;gap:10px 8px;align-content:start}
.icon{width:96px;height:104px;border-radius:10px;border:none;background:transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;transition:.12s}
.icon:hover{background:var(--glass)}
.icon:active{background:var(--glass-2)}
.icon .g{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#f4f4f2,#d9d9d6);color:#222;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7)}
.icon .g svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon .g.dark{background:linear-gradient(145deg,#3b3d42,#1f2023);color:#f2f2f0}
.icon .g.red{background:linear-gradient(145deg,#c94a38,#8f2d1f);color:#fff}
.icon .g.green{background:linear-gradient(145deg,#3f8c5e,#285f3f);color:#fff}
.icon .g.blue{background:linear-gradient(145deg,#4a6fa5,#2f4a73);color:#fff}
.icon .t{font-size:12px;line-height:1.25;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.icon.off{opacity:.45}
.icon.off .t::after{content:"준비 중";display:block;font-size:10px;color:var(--ink-3);margin-top:2px}
.icon .ext{position:absolute}

/* 창 */
.win{position:fixed;background:var(--win-bg);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4);display:flex;flex-direction:column;min-width:420px;min-height:280px;z-index:10}
.win.active{z-index:20}
.win.max{inset:30px 0 64px 0!important;width:auto!important;height:auto!important;border-radius:0}
.win .head{height:38px;background:var(--win-head);color:#fff;display:flex;align-items:center;padding:0 10px 0 14px;gap:10px;cursor:default;flex:none}
.win .head .title{font-size:12px;font-weight:600;letter-spacing:.04em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .head .ctl{display:flex;gap:6px}
.win .head .ctl button{width:26px;height:26px;border-radius:6px;border:none;background:transparent;color:rgba(255,255,255,.7);font-size:14px;line-height:1}
.win .head .ctl button:hover{background:rgba(255,255,255,.12);color:#fff}
.win .head .ctl button.x:hover{background:var(--accent)}
.win iframe{flex:1;border:none;width:100%;background:var(--win-bg)}
.win .rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize}
.win.dragging iframe,.win.resizing iframe{pointer-events:none}

/* 독 */
.dock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);height:52px;padding:6px 10px;display:flex;gap:6px;align-items:center;
  background:rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px;z-index:40}
.dock button{height:40px;padding:0 12px;border-radius:10px;border:none;background:transparent;color:var(--ink);font-size:12px;display:flex;align-items:center;gap:8px;position:relative}
.dock button:hover{background:var(--glass)}
.dock button.run::after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;border-radius:50%;background:#fff;transform:translateX(-50%)}
.dock button.active{background:var(--glass-2)}
.dock .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.dock .mini{width:22px;height:22px;border-radius:7px;background:linear-gradient(145deg,#f4f4f2,#d9d9d6);color:#222;display:flex;align-items:center;justify-content:center}
.dock .mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dock .mini.dark{background:linear-gradient(145deg,#3b3d42,#1f2023);color:#fff}
.dock .mini.red{background:linear-gradient(145deg,#c94a38,#8f2d1f);color:#fff}
.dock .mini.green{background:linear-gradient(145deg,#3f8c5e,#285f3f);color:#fff}
.dock .mini.blue{background:linear-gradient(145deg,#4a6fa5,#2f4a73);color:#fff}

@media (max-width:720px){
  .desktop{grid-template-columns:repeat(auto-fill,84px);padding:18px 12px}
  .win{inset:30px 0 64px 0!important;width:auto!important;height:auto!important;border-radius:0;min-width:0}
  .dock{left:8px;right:8px;transform:none;overflow-x:auto}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">MY RUBI<small>Rubi Workshop · internal</small></div>
  <div class="sp"></div>
  <div class="clock" id="clock"></div>
</div>

<div class="desktop" id="desktop"></div>

<div class="dock" id="dock"></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 9v12"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l-1.5-3h3M15 9l-2 4h-5"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9M4 9h16v11H4zM9 20v-6h6v6"/></symbol>
</svg>

<script>
// ─────────── 앱 목록: 여기에 한 줄 추가하면 바탕화면과 독에 아이콘이 생김 ───────────
// type: 'window' = 바탕화면 안에서 창으로 열림 / 'link' = 새 탭으로 열림
const APPS = [
  { id:'consult',  title:'상담 현황',      icon:'i-chat',   color:'dark',  type:'window', url:'/consult/',            dock:true },
  { id:'new',      title:'신규 상담',      icon:'i-plus',   color:'red',   type:'window', url:'/consult/?new=1',      dock:true },
  { id:'index',    title:'Index 시트',     icon:'i-sheet',  color:'green', type:'link',   url:'https://docs.google.com/spreadsheets/d/1wkogYTTI26ha1YsYu35pOLSBFSxIRok58qYRqRw18mA/edit', dock:true },
  { id:'drive',    title:'고객 폴더',      icon:'i-folder', color:'blue',  type:'link',   url:'https://drive.google.com/drive/folders/1nNNZEw7Pn7a186FraNtmodHsIwtncfH4', dock:true },
  { id:'bikes',    title:'출고 자전거',    icon:'i-bike',   color:'',      type:'window', url:'', disabled:true },
  { id:'care',     title:'루비케어',       icon:'i-shield', color:'',      type:'window', url:'', disabled:true },
  { id:'garage',   title:'루비개러지',     icon:'i-store',  color:'',      type:'window', url:'', disabled:true },
  { id:'settings', title:'설정',           icon:'i-gear',   color:'',      type:'window', url:'/consult/?settings=1', dock:false },
];

const $ = s => document.querySelector(s);
const wins = new Map(); // id → element

// ─────────── 바탕화면 아이콘 / 독 ───────────
function svg(id){ return `<svg><use href="#${id}"/></svg>`; }
function renderDesktop(){
  $('#desktop').innerHTML = APPS.map(a => `
    <button class="icon ${a.disabled?'off':''}" data-id="${a.id}" ${a.disabled?'disabled':''}>
      <div class="g ${a.color}">${svg(a.icon)}</div>
      <div class="t">${a.title}</div>
    </button>`).join('');
  $('#dock').innerHTML = APPS.filter(a=>a.dock).map(a => `
    <button data-id="${a.id}"><span class="mini ${a.color}">${svg(a.icon)}</span>${a.title}</button>`).join('')
    + `<div class="sep"></div><button data-id="settings"><span class="mini">${svg('i-gear')}</span>설정</button>`;
  document.querySelectorAll('.icon,.dock button').forEach(b => b.onclick = () => openApp(b.dataset.id));
}

function openApp(id){
  const a = APPS.find(x => x.id === id); if(!a || a.disabled) return;
  if(a.type === 'link'){ window.open(a.url, '_blank', 'noopener'); return; }
  // 같은 창이 이미 있으면 앞으로 가져오기 (신규 상담은 상담 현황 창과 같은 페이지이므로 공유)
  const key = a.url.startsWith('/consult/') ? 'consult' : a.id;
  if(wins.has(key)){
    const w = wins.get(key); focus(w);
    if(a.id !== 'consult'){ w.querySelector('iframe').src = a.url; }
    return;
  }
  createWindow(key, a);
}

// ─────────── 창 ───────────
let zTop = 20, offset = 0;
function createWindow(key, a){
  const w = document.createElement('div');
  w.className = 'win';
  const W = Math.min(1180, innerWidth - 80), H = Math.min(760, innerHeight - 140);
  const left = (innerWidth - W)/2 + (offset%5)*24, top = 60 + (offset%5)*24; offset++;
  w.style.cssText = `width:${W}px;height:${H}px;left:${left}px;top:${top}px`;
  w.innerHTML = `
    <div class="head">
      <span class="title">${a.id==='consult'?'상담 현황':a.title} · My Rubi</span>
      <div class="ctl">
        <button title="최소화" data-a="min">–</button>
        <button title="최대화" data-a="max">▢</button>
        <button class="x" title="닫기" data-a="close">×</button>
      </div>
    </div>
    <iframe src="${a.url}" title="${a.title}"></iframe>
    <div class="rs"></div>`;
  document.body.appendChild(w);
  wins.set(key, w);
  w.dataset.key = key;
  w.querySelector('[data-a=close]').onclick = () => { w.remove(); wins.delete(key); syncDock(); };
  w.querySelector('[data-a=max]').onclick  = () => w.classList.toggle('max');
  w.querySelector('[data-a=min]').onclick  = () => { w.style.display='none'; syncDock(); };
  w.querySelector('.head').ondblclick = () => w.classList.toggle('max');
  w.addEventListener('mousedown', () => focus(w));
  drag(w); resize(w); focus(w); syncDock();
  if(innerWidth <= 720) w.classList.add('max');
}
function focus(w){
  document.querySelectorAll('.win').forEach(x => x.classList.remove('active'));
  w.classList.add('active'); w.style.display=''; w.style.zIndex = ++zTop; syncDock();
}
function syncDock(){
  document.querySelectorAll('.dock button').forEach(b => {
    const a = APPS.find(x=>x.id===b.dataset.id); if(!a) return;
    const key = (a.url||'').startsWith('/consult/') ? 'consult' : a.id;
    const w = wins.get(key);
    b.classList.toggle('run', !!w);
    b.classList.toggle('active', !!w && w.classList.contains('active') && w.style.display!=='none');
  });
}
function drag(w){
  const head = w.querySelector('.head'); let sx, sy, ox, oy;
  head.onmousedown = e => {
    if(e.target.closest('button') || w.classList.contains('max')) return;
    sx=e.clientX; sy=e.clientY; ox=w.offsetLeft; oy=w.offsetTop; w.classList.add('dragging');
    const mv = e => { w.style.left = Math.max(-w.offsetWidth+120, ox+e.clientX-sx)+'px'; w.style.top = Math.max(30, oy+e.clientY-sy)+'px'; };
    const up = () => { w.classList.remove('dragging'); removeEventListener('mousemove',mv); removeEventListener('mouseup',up); };
    addEventListener('mousemove',mv); addEventListener('mouseup',up);
  };
}
function resize(w){
  const h = w.querySelector('.rs'); let sx, sy, ow, oh;
  h.onmousedown = e => {
    sx=e.clientX; sy=e.clientY; ow=w.offsetWidth; oh=w.offsetHeight; w.classList.add('resizing'); e.preventDefault();
    const mv = e => { w.style.width = Math.max(420, ow+e.clientX-sx)+'px'; w.style.height = Math.max(280, oh+e.clientY-sy)+'px'; };
    const up = () => { w.classList.remove('resizing'); removeEventListener('mousemove',mv); removeEventListener('mouseup',up); };
    addEventListener('mousemove',mv); addEventListener('mouseup',up);
  };
}

// ─────────── 시계 ───────────
function tick(){
  const d = new Date();
  $('#clock').textContent = d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'}) + '  ' + d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}
setInterval(tick, 15000); tick();
renderDesktop();

// 주소에 #consult 처럼 앱 id가 있으면 바로 열기
if(location.hash) openApp(location.hash.slice(1));
</script>
</body>
</html>
