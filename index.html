<main class="desk" id="desk" role="listbox" aria-label="바탕화면" tabindex="-1"></main>
<div class="drop-cell" id="dropCell"></div>
<div class="snap-hint" id="snapHint"></div>
<div id="windows"></div>

<!-- 시작 메뉴 -->
<div class="start hidden" id="start" role="dialog" aria-label="시작 메뉴">
  <div class="start-search">
    <svg class="i"><use href="#i-search"/></svg>
    <input id="startQ" type="search" placeholder="앱 검색" autocomplete="off" spellcheck="false">
  </div>
  <div class="start-body" id="startBody"></div>
  <div class="start-foot">
    <div class="who" id="startWho"><span class="gem small"></span>Rubi Workshop</div>
    <div class="foot-btns">
      <button class="foot-btn" id="startSettings"><svg class="i"><use href="#i-gear"/></svg>바탕화면 설정</button>
      <button class="foot-btn hidden" id="startLogout"><svg class="i"><use href="#i-power"/></svg>로그아웃</button>
    </div>
  </div>
</div>

<!-- 작업 표시줄 -->
<nav class="taskbar" aria-label="작업 표시줄">
  <div class="tb-apps">
    <button class="tb start-btn" id="startBtn" title="시작" aria-label="시작"><span class="gem"></span></button>
    <button class="tb-search" id="tbSearch"><svg class="i"><use href="#i-search"/></svg><span>검색</span></button>
    <div class="tb-list" id="tbList"></div>
  </div>
  <button class="tray" id="tray" title="오늘">
    <span class="t" id="clockT"></span>
    <span class="d" id="clockD"></span>
  </button>
</nav>

<div class="cal hidden" id="cal"></div>
<div class="ctx hidden" id="ctx" role="menu"></div>

<!-- 잠금 화면 (config.js 에 GOOGLE_CLIENT_ID 가 있을 때만) -->
<div class="lock hidden" id="lock" role="dialog" aria-label="로그인">
  <div class="lock-clock"><div class="t" id="lockT"></div><div class="d" id="lockD"></div></div>
  <div class="lock-card">
    <span class="gem big"></span>
    <div class="lock-name">My Rubi</div>
    <div class="lock-sub" id="lockSub">회사 구글 계정으로 로그인하세요</div>
    <div class="lock-btn" id="gBtn"></div>
    <div class="lock-msg" id="lockMsg" role="status"></div>
  </div>
</div>
