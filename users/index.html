<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Rubi · 사용자 관리</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f4f4f2;--panel:#fff;--ink:#1c1c1c;--ink-2:#5b5b5b;--ink-3:#9a9a9a;--line:#e2e2df;--rubi:#2f3136;--soft:#e9eaec;--accent:#b8402e;--ok:#2e7d4f;--mono:"SF Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
main{max-width:980px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--ink-2);font-size:13px;margin-bottom:20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.box h2{font-size:11px;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin:0 0 12px;text-transform:uppercase}
.add{display:grid;grid-template-columns:1fr 1fr 140px 110px;gap:8px;align-items:end}
.f label{display:block;font-size:11px;color:var(--ink-3);margin-bottom:4px}
.f input,.f select{width:100%;height:36px;border:1px solid var(--line);border-radius:7px;padding:0 10px;background:#fff}
.btn{height:36px;padding:0 14px;border-radius:7px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.btn.primary{background:var(--rubi);color:#fff;border-color:var(--rubi);font-weight:600}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--ink-3);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.id{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
td select{height:30px;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:#fff;font-size:12px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;background:var(--soft);color:var(--ink-2)}
.tag.off{background:#f6e4e1;color:var(--accent)}
.tag.warn{background:#fbf1d9;color:#8a6510}
.acts{display:flex;gap:6px;justify-content:flex-end}
.msg{font-size:12px;margin-top:10px;color:var(--ink-2);min-height:18px}
.msg.err{color:var(--accent)}
.msg.ok{color:var(--ok)}
.temp{display:none;margin-top:12px;padding:12px 14px;border-radius:8px;background:#1f2023;color:#fff}
.temp b{font-family:var(--mono);font-size:16px;letter-spacing:.06em;margin:0 8px;user-select:all}
.temp small{display:block;color:rgba(255,255,255,.6);margin-top:4px}
.temp button{margin-left:8px;height:26px;border-radius:5px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:12px;padding:0 8px}
@media (max-width:720px){.add{grid-template-columns:1fr 1fr}.hide-m{display:none}}
</style>
</head>
<body>
<main>
  <h1>사용자 관리</h1>
  <div class="sub">My Rubi에 로그인할 직원 계정을 추가하고 관리합니다. 새 계정과 비밀번호 초기화는 임시 비밀번호가 발급되며, 첫 로그인 때 본인이 바꾸게 됩니다.</div>

  <div class="box">
    <h2>계정 추가</h2>
    <form class="add" id="addForm">
      <div class="f"><label>아이디 (영문·숫자)</label><input id="aId" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: staff01"></div>
      <div class="f"><label>이름</label><input id="aName" autocomplete="off" placeholder="예: 홍길동 매니저"></div>
      <div class="f"><label>권한</label><select id="aRole"><option value="staff">직원</option><option value="admin">관리자</option></select></div>
      <button class="btn primary" id="aGo" type="submit">추가</button>
    </form>
    <div class="temp" id="temp"></div>
    <div class="msg" id="aMsg"></div>
  </div>

  <div class="box">
    <h2>계정 목록</h2>
    <table>
      <thead><tr><th>아이디</th><th>이름</th><th>권한</th><th>상태</th><th class="hide-m">최근 로그인</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" style="color:var(--ink-3)">불러오는 중…</td></tr></tbody>
    </table>
    <div class="msg" id="lMsg"></div>
  </div>
</main>

<script src="/config.js"></script>
<script src="/lib.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const me = MR.user() || {};
let users = [];

function showTemp(name, id, pw){
  $('temp').style.display = 'block';
  $('temp').innerHTML = `${esc(name)} (${esc(id)}) 임시 비밀번호<b id="tpw">${esc(pw)}</b><button type="button" id="tcopy">복사</button>
    <small>이 화면을 닫으면 다시 볼 수 없습니다. 직원에게 전달해 주세요. 첫 로그인 때 새 비밀번호로 바꾸게 됩니다.</small>`;
  $('tcopy').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(pw); $('tcopy').textContent = '복사됨'; };
}

async function load(){
  try {
    const j = await MR.get({ action:'users' });
    users = j.users; render(); $('lMsg').textContent = '';
  } catch(e){ $('rows').innerHTML = ''; $('lMsg').className = 'msg err'; $('lMsg').textContent = e.message; }
}

function render(){
  $('rows').innerHTML = users.map(u => {
    const self = u.id.toLowerCase() === String(me.id||'').toLowerCase();
    return `<tr data-id="${esc(u.id)}">
      <td class="id">${esc(u.id)}${self ? ' <span class="tag">나</span>' : ''}</td>
      <td>${esc(u.name)}</td>
      <td><select data-a="role" ${self?'disabled':''}><option value="staff" ${u.role==='staff'?'selected':''}>직원</option><option value="admin" ${u.role==='admin'?'selected':''}>관리자</option></select></td>
      <td>${u.active ? (u.mustChange ? '<span class="tag warn">비밀번호 변경 대기</span>' : '<span class="tag">사용 중</span>') : '<span class="tag off">비활성</span>'}</td>
      <td class="hide-m" style="font-family:var(--mono);font-size:12px;color:var(--ink-2)">${esc(u.lastLogin) || '–'}</td>
      <td><div class="acts">
        <button class="btn sm" data-a="rename">이름</button>
        <button class="btn sm" data-a="reset">비밀번호 초기화</button>
        ${self ? '' : `<button class="btn sm ${u.active?'danger':''}" data-a="toggle">${u.active?'비활성':'활성'}</button>`}
      </div></td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" style="color:var(--ink-3)">계정이 없습니다</td></tr>';

  document.querySelectorAll('#rows tr[data-id]').forEach(tr => {
    const id = tr.dataset.id, u = users.find(x => x.id === id);
    tr.querySelectorAll('[data-a]').forEach(el => {
      const a = el.dataset.a;
      if(a === 'role') el.onchange = () => update({ id, role: el.value }, `${u.name} 권한을 바꿨습니다`);
      if(a === 'rename') el.onclick = () => { const n = prompt('이름', u.name); if(n && n.trim() && n.trim() !== u.name) update({ id, name: n.trim() }, '이름을 바꿨습니다'); };
      if(a === 'toggle') el.onclick = () => { if(confirm(`${u.name} 계정을 ${u.active?'비활성화':'다시 활성화'}할까요?${u.active?' 로그인 중인 세션도 종료됩니다.':''}`)) update({ id, active: !u.active }, u.active ? '비활성화했습니다' : '활성화했습니다'); };
      if(a === 'reset') el.onclick = async () => {
        if(!confirm(`${u.name} 비밀번호를 초기화할까요? 로그인 중인 세션이 종료되고 임시 비밀번호가 발급됩니다.`)) return;
        const j = await update({ id, resetPassword: true }, '비밀번호를 초기화했습니다');
        if(j && j.tempPassword) showTemp(u.name, u.id, j.tempPassword);
      };
    });
  });
}

async function update(body, okMsg){
  $('lMsg').className = 'msg'; $('lMsg').textContent = '저장 중…';
  try {
    const j = await MR.post(Object.assign({ action:'users.update' }, body));
    const i = users.findIndex(x => x.id === j.user.id); if(i >= 0) users[i] = j.user;
    render(); $('lMsg').className = 'msg ok'; $('lMsg').textContent = okMsg; return j;
  } catch(e){ $('lMsg').className = 'msg err'; $('lMsg').textContent = e.message; load(); }
}

$('addForm').onsubmit = async e => {
  e.preventDefault();
  const id = $('aId').value.trim(), name = $('aName').value.trim(), role = $('aRole').value;
  if(!id || !name){ $('aMsg').className = 'msg err'; $('aMsg').textContent = '아이디와 이름을 입력하세요'; return; }
  $('aGo').disabled = true; $('aMsg').className = 'msg'; $('aMsg').textContent = '추가 중…';
  try {
    const j = await MR.post({ action:'users.add', id, name, role });
    users.push(j.user); render();
    showTemp(j.user.name, j.user.id, j.tempPassword);
    $('aId').value = ''; $('aName').value = ''; $('aRole').value = 'staff';
    $('aMsg').className = 'msg ok'; $('aMsg').textContent = '계정을 추가했습니다';
  } catch(err){ $('aMsg').className = 'msg err'; $('aMsg').textContent = err.message; }
  finally { $('aGo').disabled = false; }
};

if(MR.requireLogin()){
  if(me.role !== 'admin'){ document.querySelector('main').innerHTML = '<h1>사용자 관리</h1><div class="sub">관리자만 사용할 수 있습니다.</div>'; }
  else load();
}
</script>
</body>
</html>
